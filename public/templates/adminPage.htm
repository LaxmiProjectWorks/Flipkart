<div class="admin-form-container">
    <h4>Product Form</h4>
    <ul>
        <li>
            Product Name:
            <input type="text" id="product_title">
        </li>
        <li>
            Price:
            <input type="text" id="product_price">
        </li>
        <li>
            Category:
            <select id="product_category">
                <option>Jewellery</option>
                <option>Electronics</option>
                <option>Men's Clothing</option>
                <option>Women's Clothing</option>
            </select>
        </li>

        <li>
            Rating:
            <input type="number" min="1" max="5" step="1" id="product_rating">
        </li>
        <li>
            Description:
            <textarea id="product_description" cols="30" rows="5" maxlength="250"></textarea>
        </li>
        <li>
            Image:
            <input type="file" id="product_image">
        </li>

        <li class="action-row">
            <button onclick="addNewProductDataIntoDB()">Add Details</button>
            <a href="#" onclick="selectedPageLoader('login')">Login</a>
            <a href="#" onclick="selectedPageLoader('signup')">Signup</a>
        </li>

        <li class="productInsertionStatus"></li>
    </ul>
</div>

<!-- Chat Section -->
<h3>Chat with Seller</h3>

<div id="chatBox" style="height:200px; overflow:auto; border:1px solid black;">
</div>

<input type="text" id="messageInput" placeholder="Type message...">
<button onclick="sendMessage()">Send</button>
