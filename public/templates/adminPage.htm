<div class="card">
    <h2>Product Form</h2>

    <div class="form-row">
        <div class="form-group">
            <label>Product Name</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Price</label>
            <input type="text">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Category</label>
            <select>
                <option>Jewellery</option>
                <option>Electronics</option>
                <option>Clothing</option>
            </select>
        </div>

        <div class="form-group">
            <label>Rating</label>
            <input type="text">
        </div>
    </div>

    <div class="full">
        <label>Description</label>
        <textarea></textarea>
    </div>

    <div class="full">
        <label>Product Image</label>
        <div class="upload-section">
            <input type="file">
        </div>
    </div>

    <button class="btn">Add Details</button>

</div>
