<div class="adminWrapper">

    <!-- ✅ LEFT SIDE (FORM - SAME) -->
    <div class="leftAdmin">

        <div class="admin-form-container">
            <h4>Product Form</h4>
            <ul>
                <li>Product Name:<input type="text" id="product_title"></li>

                <li>Price:<input type="text" id="product_price"></li>

                <li>
                    Category:
                    <select id="product_category">
                        <option value="">Select</option>
                        <option>Jewellery</option>
                        <option>Electronics</option>
                        <option>Men's Clothing</option>
                        <option>Women's Clothing</option>
                    </select>
                </li>

                <li>Rating:<input type="number" id="product_rating"></li>

                <li>Description:<textarea id="product_description"></textarea></li>

                <li>Image:<input type="file" id="product_image"></li>

                <li>
                    <button onclick="addNewProductDataIntoDB()">Add Details</button>
                </li>
                <li>
                    <a href="#" onclick="selectedPageLoader('login')">Login</a>
                    <a href="#" onclick="selectedPageLoader('signup')">Signup</a>
                </li>


                <li class="productInsertionStatus"></li>
            </ul>
        </div>

    </div>

    <div class="rightAdmin">
        <!-- ✅ USER LIST VIEW (VISIBLE FIRST) -->
        <div id="userListView" class="activeView">

            <!-- HEADER -->
            <div class="userListHeader">
                <h3>
                    <i class="fa-solid fa-headset"></i>Active Chats
                </h3>
                <span class="userCount"></span>
            </div>

            <!-- USER LIST -->
            <div class="userList"></div>

        </div>

        <!-- ✅ CHAT VIEW (HIDDEN INITIALLY) -->
        <div id="chatView">

            <div class="chatHeader">
                <span class="backBtn" onclick="goBack()">
                    <i class="fa-solid fa-arrow-left"></i>
                </span>
                <span id="chatUserName">Customer Support</span>
            </div>

            <div id="chatBox"></div>

            <div class="chatInputWrapper">
                <input id="messageInput" placeholder="Type message">
                <button onclick="sendAdminMessage()">Send</button>
            </div>

        </div>

    </div>
</div>
