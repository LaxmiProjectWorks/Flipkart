<div class="productCard">
    <img src="{{image}}">
    <!-- <h2>{{title}}</h2> -->
    <p class="category">Category: {{category}}</p>
    <!-- <p class="description" style="display: none;"></p> -->
    <p class="price">Price: {{price}}</p>
    <p class="rating rating_{{id}}"></p>
    <p><button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModalCenter_{{id}}">Description</button>
        <button type="button" class="btn btn-primary">Add to Cart</button>
    </p>

    <!-- Modal -->
    <div class="modal fade" id="exampleModalCenter_{{id}}" tabindex="-1" role="dialog"
        aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLongTitle">Product Description</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    {{description}}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>
